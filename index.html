<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strength Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-smooth.css">
</head>
<body>

  <!-- Soft depth/relief shadow for the anatomical figures. -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <filter id="body-depth" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#1a2330" flood-opacity="0.3"/>
      </filter>
    </defs>
  </svg>

  <div id="tooltip" role="tooltip" aria-live="polite"></div>

  <header>
    <img class="brand-logo" src="logo.png" alt="Strength Atlas logo" width="72" height="72">
    <h1>Strength Atlas</h1>
    <p class="tagline" data-i18n="tagline">click a muscle &middot; discover your exercises</p>
  </header>

  <div class="workspace">
    <section class="diagrams-area" aria-label="Body diagrams">
      <div class="chart-wrapper">
        <svg id="body-front" viewBox="-50 -40 734 1538" role="img" aria-label="Front body diagram"></svg>
        <span class="view-caption" data-i18n="frontSide">Front Side</span>
      </div>
      <div class="chart-wrapper">
        <svg id="body-back" viewBox="756 0 774 1448" role="img" aria-label="Back body diagram"></svg>
        <span class="view-caption" data-i18n="backSide">Back Side</span>
      </div>
    </section>

    <aside id="exercise-panel" class="exercise-panel" aria-label="Exercises">
      <div class="panel-inner">
        <div class="panel-header">
          <h2 id="panel-muscle-name"></h2>
          <button id="panel-close" aria-label="Close exercise panel">&times;</button>
        </div>
        <div id="exercise-list" class="exercise-list"></div>
      </div>
    </aside>
  </div>

  <script type="module" src="app-smooth.js"></script>
</body>
</html>
