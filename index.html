<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strength Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SVG filter for hand-drawn sketch effect on body diagrams.
       Must NOT use display:none — iOS Safari won't resolve a filter
       referenced from a display:none element, blanking the figures. -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <filter id="sketch-filter" x="-12%" y="-12%" width="124%" height="124%">
        <feTurbulence type="fractalNoise" baseFrequency="0.28" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div id="tooltip" role="tooltip" aria-live="polite"></div>

  <header>
    <h1>Strength Atlas</h1>
    <p class="tagline">click a muscle &middot; discover your exercises</p>
  </header>

  <div class="workspace">
    <section class="diagrams-area" aria-label="Body diagrams">
      <div class="chart-wrapper">
        <svg id="body-front" viewBox="0 0 35 93" role="img" aria-label="Front body diagram"></svg>
        <span class="view-caption">Front Side</span>
      </div>
      <div class="chart-wrapper">
        <svg id="body-back" viewBox="37 0 35 93" role="img" aria-label="Back body diagram"></svg>
        <span class="view-caption">Back Side</span>
      </div>
    </section>

    <aside id="exercise-panel" class="exercise-panel" aria-label="Exercises">
      <div class="panel-inner">
        <div class="panel-header">
          <h2 id="panel-muscle-name"></h2>
          <button id="panel-close" aria-label="Close exercise panel">&times;</button>
        </div>
        <div id="exercise-list" class="exercise-list"></div>
      </div>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
